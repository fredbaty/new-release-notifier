databases:
  beets_db: "/path/to/your/beets/musiclibrary.db"
  notifications_db: "/path/to/your/database/notifications.db"

ntfy:
  base_url: "https://ntfy.sh"       # Server root, no topic and no trailing slash
  topic: "music-releases"           # Topic name only
  token: "tk_exampletoken123456"    # Access token, without the "Bearer " prefix

health_check:
  url: "https://hc-ping.com/your-uuid-here"

musicbrainz:
  contact: "your-email@example.com"
  # Matched against a lowercased MusicBrainz type. The two lists are separate
  # because that is how MusicBrainz models them: "single" is only ever a primary
  # type, "compilation" only ever a secondary one.
  excluded_primary_types:
    - "single"
  excluded_secondary_types:
    - "compilation"
